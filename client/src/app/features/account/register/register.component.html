 <mat-card class="max-w-lg mx-auto mt-32 p-8 bg-white">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-semibold text-primary">Register</h1>
        </div>
        <!-- <mat-form-field appearance="fill"  class="w-full mb-4">
            <mat-label>FirstName</mat-label>
            <input formControlName="firstName" matInput type="email">
            @if(registerForm.get('firstName')?.hasError('required')){
                <mat-error>
                    FirstName is required
                </mat-error>
            }
        </mat-form-field> -->
        <app-text-input label="FirstName" formControlName="firstName" />
        <app-text-input label="LastName" formControlName="lastName" />
        <app-text-input label="Email" formControlName="email" type="email" />
        <app-text-input label="Password" formControlName="password" type="password" />

        <!-- <mat-form-field appearance="fill"  class="w-full mb-4">
            <mat-label>LastName</mat-label>
            <input formControlName="lastName" matInput type="text">
        </mat-form-field>
        <mat-form-field appearance="fill"  class="w-full mb-4">
            <mat-label>Email</mat-label>
            <input formControlName="email" matInput type="email">
        </mat-form-field>
        <mat-form-field appearance="fill" class="w-full mb-4">
            <mat-label>Password</mat-label>
            <input formControlName="password" matInput type="password">
        </mat-form-field> -->

        @if(validationErrors){
            <div class="mb-3 p-4 bg-red-100 text-red-600">
                <ul class="list-disc px-3">
                    @for(err of validationErrors;track $index){
                        <li>{{err}}</li>
                    }
                </ul>
            </div>
        }

        <button 
            [disabled]="registerForm.invalid"
            mat-flat-button 
            type="submit" 
            class="w-full py-2">
                Register
        </button>
    </form>
 </mat-card>
